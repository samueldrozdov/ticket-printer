<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <title>Samson · Messages</title>
    <link rel="icon" type="image/png" href="assets/samson-avatar.png">
    <link rel="stylesheet" href="chat.css">
    <script>
        // Set this URL when the frontend is hosted separately from Samson.
        const productionApiUrl = 'YOUR_API_URL_HERE';
        window.PRINTER_API_URL = (
            window._env?.REACT_APP_API_URL ||
            (productionApiUrl !== 'YOUR_API_URL_HERE' ? productionApiUrl : '') ||
            window.location.origin
        ).replace(/\/$/, '');
    </script>
    <script src="live-listening.js" defer></script>
    <script src="audio-meter.js" defer></script>
    <script src="settings.js" defer></script>
    <script src="history.js" defer></script>
    <script src="chat.js" defer></script>
</head>
<body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="icon-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol>
        <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
        <symbol id="icon-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
        <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
        <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1v15"/></symbol>
        <symbol id="icon-quote" viewBox="0 0 24 24"><path d="M10 6H4v7h6V6Zm0 7c0 4-2 5-5 5M20 6h-6v7h6V6Zm0 7c0 4-2 5-5 5"/></symbol>
        <symbol id="icon-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9h.01M16 9h.01M8 14a4 4 0 0 0 8 0"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
        <symbol id="icon-live" viewBox="0 0 24 24"><path d="M3 10v4M7 6v12M11 3v18M15 8v8M19 5v14M23 10v4"/></symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    </svg>
    <main class="chat-app" aria-label="Conversation with Samson">
        <header class="chat-header">
            <h1 class="contact-heading"><button class="contact" id="contactButton" type="button" aria-label="Samson settings and info" aria-haspopup="dialog" aria-controls="samsonSettings">
                <span class="avatar" id="piAvatar" role="img" aria-label="Samson, checking connection" data-connection="checking">
                    <img src="assets/samson-avatar.png" alt="" width="44" height="44">
                </span>
                <span class="contact-name">Samson <svg aria-hidden="true"><use href="#icon-chevron"/></svg></span>
            </button></h1>
        </header>
        <dialog class="samson-settings" id="samsonSettings" aria-labelledby="samsonSettingsTitle">
            <button class="icon-button settings-close" id="closeSamsonSettings" type="button" aria-label="Close settings" autofocus><svg aria-hidden="true"><use href="#icon-close"/></svg></button>
            <div class="settings-profile">
                <img src="assets/samson-avatar.png" alt="" width="72" height="72">
                <h2 id="samsonSettingsTitle">Samson</h2>
                <div class="settings-metadata" role="group" aria-label="Connection status" aria-live="polite">
                    <span class="metadata-status" id="piMetadata" role="img" aria-label="Pi: Checking…" data-state="checking">Pi</span>
                    <span class="metadata-status" id="printerMetadata" role="img" aria-label="Printer: Checking…" data-state="checking">Printer</span>
                    <span class="metadata-status" id="microphoneMetadata" role="img" aria-label="Mic: Checking…" data-state="checking">Mic</span>
                </div>
            </div>
            <section class="settings-section" aria-labelledby="settingsHeading">
                <h3 id="settingsHeading">Messages</h3>
                <div class="settings-list">
                    <label class="settings-row date-setting" for="includeDate"><span>Date</span><input id="includeDate" type="checkbox" role="switch" checked><span class="settings-switch" aria-hidden="true"></span></label>
                    <div class="settings-row spacing-setting">
                        <span id="messageSpacingLabel">Spacing</span>
                        <div class="spacing-options" role="radiogroup" aria-labelledby="messageSpacingLabel">
                            <label><input id="feedLinesSmall" type="radio" name="messageSpacing" value="3" aria-label="Small message spacing"><span>S</span></label>
                            <label><input id="feedLinesDefault" type="radio" name="messageSpacing" value="6" aria-label="Medium message spacing" checked><span>M</span></label>
                            <label><input id="feedLinesLarge" type="radio" name="messageSpacing" value="12" aria-label="Large message spacing"><span>L</span></label>
                        </div>
                    </div>
                    <label class="settings-row font-setting" for="fontFamily"><span>Font</span><span class="font-select">
                        <select id="fontFamily">
                            <option value="mono">Monospace</option>
                            <option value="sans" selected>Sans</option>
                            <option value="serif">Serif</option>
                        </select>
                        <svg aria-hidden="true"><use href="#icon-chevron"/></svg>
                    </span></label>
                    <div class="settings-row font-size-setting">
                        <span id="fontSizeLabel">Font size</span>
                        <div class="spacing-options" role="radiogroup" aria-labelledby="fontSizeLabel">
                            <label><input id="fontSizeSmall" type="radio" name="fontSize" value="small" aria-label="Small font size"><span>S</span></label>
                            <label><input id="fontSizeMedium" type="radio" name="fontSize" value="medium" aria-label="Medium font size" checked><span>M</span></label>
                            <label><input id="fontSizeLarge" type="radio" name="fontSize" value="large" aria-label="Large font size"><span>L</span></label>
                        </div>
                    </div>
                </div>
            </section>
            <details class="settings-section connection-details" aria-labelledby="infoHeading">
                <summary class="connection-heading"><h3 id="infoHeading">Connection</h3><svg aria-hidden="true"><use href="#icon-chevron"/></svg></summary>
                <div class="server-notice" id="serverNotice" hidden><strong id="serverNoticeTitle"></strong><p id="serverNoticeText"></p></div>
                <dl class="connection-list" aria-live="polite">
                    <div class="settings-row"><dt><span id="serverLabel">Server</span></dt><dd class="connection-status" id="piConnection" data-state="checking">Checking…</dd></div>
                    <div class="settings-row"><dt>Microphone</dt><dd class="connection-status" id="microphoneConnection" data-state="checking">Checking…</dd></div>
                    <div class="settings-row"><dt>Printer<small id="printerTransport"></small></dt><dd class="connection-status" id="printerConnection" data-state="checking">Checking…</dd></div>
                </dl>
                <div class="connection-actions"><button id="refreshConnections" type="button">Check again</button></div>
                <p class="settings-note connection-explanation" id="printerExplanation" role="status"></p>
            </details>
        </dialog>
        <div class="messages" id="messages" role="log" aria-label="Messages with Samson" aria-live="polite" aria-relevant="additions text">
            <div class="message-track" id="messageTrack">
                <section class="print-history" id="printHistory" aria-labelledby="historyTitle">
                    <h2 id="historyTitle" hidden>Print history</h2>
                    <p class="history-notice" id="historyNotice" role="status"><span id="historyNoticeText">Loading saved tickets…</span> <button class="history-retry" id="historyRetry" type="button" hidden>Retry</button></p>
                    <button class="history-more" id="historyMore" type="button" hidden>Load older tickets</button>
                    <div class="history-entries" id="historyEntries"></div>
                </section>
                <p class="day-label" id="dayLabel">Today</p>
                <article class="message incoming">
                    <div class="bubble">Hey, I’m Samson. 👋</div>
                </article>
            </div>
        </div>
        <div class="composer-area">
            <div class="add-menu" id="addMenu" aria-label="Add to your message" hidden>
                <button id="photoButton" type="button"><span class="menu-icon"><svg aria-hidden="true"><use href="#icon-image"/></svg></span>Photo</button>
                <button id="vocabButton" type="button"><span class="menu-icon"><svg aria-hidden="true"><use href="#icon-book"/></svg></span>Vocab Word</button>
                <button id="quoteButton" type="button"><span class="menu-icon"><svg aria-hidden="true"><use href="#icon-quote"/></svg></span>Random Quote</button>
                <button id="memeButton" type="button"><span class="menu-icon"><svg aria-hidden="true"><use href="#icon-smile"/></svg></span>Random Meme</button>
                <button id="listenButton" type="button" aria-controls="listenSettings"><span class="menu-icon"><svg aria-hidden="true"><use href="#icon-live"/></svg></span><span class="menu-copy">Passive Listening</span><svg class="menu-chevron" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
            </div>
            <form class="listen-settings" id="listenSettings" aria-labelledby="listenSettingsTitle" hidden>
                <div class="listen-heading"><h2 id="listenSettingsTitle">Passive Listening</h2><button class="icon-button listen-close" id="closeListenSettings" type="button" aria-label="Back to plus menu"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></div>
                <div class="listen-fields">
                    <div class="listen-option"><label for="listenCadence">Print every</label><select id="listenCadence"><option value="10">10 seconds</option><option value="30">30 seconds</option><option value="60">1 minute</option><option value="300">5 minutes</option><option value="custom">Custom…</option></select><label class="listen-custom" id="customCadenceRow" hidden><input id="customCadence" type="number" min="1" max="300" step="1" value="20" aria-label="Print interval in seconds" disabled required>seconds · up to 300</label></div>
                    <div class="listen-option"><label for="listenDuration">Stop after</label><select id="listenDuration"><option value="0">Until I stop</option><option value="300">5 minutes</option><option value="900">15 minutes</option><option value="3600">1 hour</option><option value="custom">Custom…</option></select><label class="listen-custom" id="customDurationRow" hidden><input id="customDuration" type="number" min="1" max="1440" step="1" value="10" aria-label="Listening duration in minutes" disabled required>minutes · up to 1,440</label></div>
                </div>
                <p class="listen-error" id="listenSettingsError" role="alert" hidden></p>
                <button class="listen-start" id="startListening" type="submit" disabled><svg aria-hidden="true"><use href="#icon-mic"/></svg><span>Start listening</span></button>
            </form>
            <div class="listening-bar" id="listeningBar" hidden>
                <div class="audio-meter" id="listeningAudioMeter" hidden></div>
                <div class="listening-copy">
                    <div class="listening-title"><span id="listeningLabel">Starting…</span><time id="listeningTime">0:00</time></div>
                    <p id="listeningDetails" class="listening-details"></p>
                    <p id="listeningWarning" class="listening-warning" hidden></p>
                </div>
                <button class="listening-stop" id="stopListening" type="button"><svg aria-hidden="true"><use href="#icon-stop"/></svg><span>Stop</span></button>
            </div>
            <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <form class="composer" id="messageForm">
                <button class="icon-button plus-button" id="plusButton" type="button" aria-label="Add to your message" aria-controls="addMenu listenSettings" aria-expanded="false">
                    <svg aria-hidden="true"><use href="#icon-plus"/></svg>
                </button>
                <div class="message-field" id="messageField">
                    <div class="image-attachment" id="imageAttachment" hidden>
                        <img id="imagePreview" alt="Photo to send to Samson">
                        <button class="icon-button remove-image" id="removeImageButton" type="button" aria-label="Remove photo">
                            <svg aria-hidden="true"><use href="#icon-close"/></svg>
                        </button>
                    </div>
                    <div class="input-row">
                        <textarea id="messageInput" rows="1" maxlength="1000" enterkeyhint="send" aria-label="Message Samson" placeholder="Message Samson"></textarea>
                        <div class="recording" id="recording" hidden>
                            <div class="recording-bar"><div class="audio-meter" id="recordingAudioMeter" hidden></div><span class="recording-label" id="recordingLabel">Starting…</span><time id="recordingTime">0:00</time></div>
                            <p class="partial-transcript" id="partialTranscript" hidden></p>
                        </div>
                        <button class="icon-button send-button" id="sendButton" type="submit" aria-label="Send to Samson" hidden>
                            <svg aria-hidden="true"><use href="#icon-send"/></svg>
                        </button>
                    </div>
                </div>
                <button class="icon-button microphone-button" id="microphoneButton" type="button" aria-label="Record on Samson" aria-pressed="false" disabled>
                    <svg id="microphoneIcon" aria-hidden="true"><use href="#icon-mic"/></svg>
                    <svg id="stopIcon" aria-hidden="true" hidden><use href="#icon-stop"/></svg>
                </button>
            </form>
        </div>
        <p class="sr-only" id="liveStatus" role="status" aria-live="polite"></p>
        <noscript><p class="noscript">Enable JavaScript to message Samson.</p></noscript>
    </main>
</body>
</html>
